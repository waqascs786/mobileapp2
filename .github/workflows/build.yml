name: Build Mobile App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application name'
        required: true
        default: 'PagePilot'
      package_name:
        description: 'Package name (e.g., com.example.app)'
        required: true
        default: 'com.pagepilot.app'
      primary_color:
        description: 'Primary color (hex)'
        required: true
        default: '#4F46E5'
      api_url:
        description: 'WordPress API URL'
        required: true
        default: 'https://example.com/wp-json'
      build_number:
        description: 'Build number'
        required: true
        default: '1'

  repository_dispatch:
    types: [pagepilot_build]

  push:
    branches:
      - main

env:
  APP_NAME: ${{ github.event.inputs.app_name || github.event.client_payload.app_name || 'PagePilot' }}
  PACKAGE_NAME: ${{ github.event.inputs.package_name || github.event.client_payload.app_package || 'com.pagepilot.app' }}
  PRIMARY_COLOR: ${{ github.event.inputs.primary_color || github.event.client_payload.primary_color || '#4F46E5' }}
  API_URL: ${{ github.event.inputs.api_url || github.event.client_payload.api_url || 'https://example.com/wp-json' }}
  BUILD_NUMBER: ${{ github.event.inputs.build_number || github.event.client_payload.build_number || '1' }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Save our Dart code
        run: |
          cp -R lib /tmp/pagepilot_lib
          cp pubspec.yaml /tmp/pagepilot_pubspec.yaml
          cp pubspec.lock /tmp/pagepilot_pubspec.lock 2>/dev/null || true
          cp analysis_options.yaml /tmp/pagepilot_analysis.yaml 2>/dev/null || true

      - name: Generate Flutter scaffold
        run: |
          flutter create --project-name pagepilot_app --org com.example --platforms android .
          cp /tmp/pagepilot_pubspec.yaml pubspec.yaml
          cp /tmp/pagepilot_pubspec.lock pubspec.lock 2>/dev/null || true
          cp /tmp/pagepilot_analysis.yaml analysis_options.yaml 2>/dev/null || true
          rm -rf test/

      - name: Restore Dart code
        run: |
          rm -rf lib
          cp -R /tmp/pagepilot_lib lib

      - name: Apply app config
        run: |
          sed -i "s|com.example.pagepilot|${{ env.PACKAGE_NAME }}|g" android/app/build.gradle
          sed -i "s|namespace = \"com.example.pagepilot\"|namespace = \"${{ env.PACKAGE_NAME }}\"|g" android/app/build.gradle
          sed -i "s|applicationId = \"com.example.pagepilot\"|applicationId = \"${{ env.PACKAGE_NAME }}\"|g" android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Save our Dart code
        run: |
          cp -R lib /tmp/pagepilot_lib
          cp pubspec.yaml /tmp/pagepilot_pubspec.yaml
          cp pubspec.lock /tmp/pagepilot_pubspec.lock 2>/dev/null || true
          cp analysis_options.yaml /tmp/pagepilot_analysis.yaml 2>/dev/null || true

      - name: Generate Flutter scaffold
        run: |
          flutter create --project-name pagepilot_app --org com.example --platforms ios .
          cp /tmp/pagepilot_pubspec.yaml pubspec.yaml
          cp /tmp/pagepilot_pubspec.lock pubspec.lock 2>/dev/null || true
          cp /tmp/pagepilot_analysis.yaml analysis_options.yaml 2>/dev/null || true
          rm -rf test/

      - name: Restore Dart code
        run: |
          rm -rf lib
          cp -R /tmp/pagepilot_lib lib

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build iOS Simulator
        run: flutter build ios --simulator

      - name: Create iOS build zip
        run: cd build/ios/iphonesimulator && zip -r ios-build-${{ env.BUILD_NUMBER }}.zip ./

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ env.BUILD_NUMBER }}
          path: build/ios/iphonesimulator/ios-build-${{ env.BUILD_NUMBER }}.zip
          retention-days: 30

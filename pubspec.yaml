name: wp_mobile_app
description: A mobile app generated by PagePilot from WordPress LMS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  cached_network_image: ^3.3.0
  flutter_html: ^3.0.0
  provider: ^6.1.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.0
  pull_to_refresh: ^2.0.0
  flutter_svg: ^2.0.7
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  flutter_local_notifications: ^16.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
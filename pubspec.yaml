name: pagepilot_app
description: Mobile learning app powered by PagePilot

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  flutter_html: ^3.0.0-beta.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  webview_flutter: ^4.7.0
  flutter_local_notifications: ^17.0.0
  firebase_messaging: ^14.7.9
  firebase_core: ^2.25.4
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.2
  percent_indicator: ^4.2.3
  pull_to_refresh: ^2.0.0
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/Regular.ttf
        - asset: assets/fonts/Medium.ttf
          weight: 500
        - asset: assets/fonts/Bold.ttf
          weight: 700
